name: Cours BRVM
# Une seule exécution longue lit la page des cours toutes les 3 minutes jusqu'à la fermeture du marché (15h00, ±1 min ; 12h00 la veille d'un jour férié ; rien les jours fériés).
# Horaires et jours fériés : scripts/horaire.py (source brvm.org/fr/horaires-de-cotation et /fr/jours-feries).
# Plus fiable que 6 lancements programmés par heure, car GitHub retarde ou saute souvent ces lancements.
on:
  schedule:
    - cron: "12 9 * * 1-5"    # démarrage normal, 9h12 (heure creuse : GitHub retarde surtout les lancements pile à l'heure et à la demie) (le premier cours coté est à 9h45 ; GitHub limite une exécution à 6 h)
    - cron: "37 9 * * 1-5"    # 2e filet, 9h37 : GitHub retarde souvent le lancement de 9h30 (si une exécution tourne déjà, celle-ci attend puis s'arrête aussitôt)
    - cron: "5 11 * * 1-5"    # filet de sécurité : relance si le démarrage de 9h30 a été sauté
  workflow_dispatch: {}        # démarrage à la main (bouton Run workflow) : elle s'arrête à la fermeture du marché
permissions:
  contents: write
concurrency:
  group: cours
  cancel-in-progress: false
jobs:
  cours:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Lire les cours toutes les 3 minutes jusqu'à la fermeture
        run: |
          git config user.name "hbi-bot"
          git config user.email "hbi-bot@users.noreply.github.com"
          set -- $(python3 scripts/horaire.py)
          [ "$1" = "FERIE" ] && { echo "Marché fermé aujourd'hui (week-end ou jour férié)"; exit 0; }
          FIN=$2
          while true; do
            hm=$(date -u +%H%M)
            [ "$hm" -ge "$FIN" ] && { echo "Fin de séance ($hm UTC)"; break; }
            # on repart à chaque tour de l'état publié (jamais de fusion en conflit : le robot ne modifie que cours.json et data/cloture_precedente.json)
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main || echo "Synchronisation échouée, on continue"
            python3 scripts/fetch_cours.py || echo "Lecture échouée, on réessaie au prochain tour"
            git add cours.json data/cloture_precedente.json
            git diff --cached --quiet || { git commit -q -m "Cours $(date -u +%d/%m %H:%M) UTC" && git push -q || { echo "Enregistrement échoué, on réessaie au prochain tour"; git fetch -q origin main; git reset -q --hard origin/main; }; }
            # la BRVM met sa page à jour toutes les 15 min : on la relit toutes les 3 min (2 min dans l'heure de clôture) pour afficher chaque relevé sans attendre
            [ "$hm" -ge $((FIN - 70)) ] && sleep 120 || sleep 180
          done
