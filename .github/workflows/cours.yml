name: Cours BRVM
on:
  schedule:
    - cron: "*/10 9-15 * * 1-5"   # heures UTC = heure d'Abidjan ; GitHub peut retarder un lancement de quelques minutes
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: cours
  cancel-in-progress: false
jobs:
  cours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire la page des cours BRVM
        run: python3 scripts/fetch_cours.py
      - name: Enregistrer cours.json
        run: |
          git config user.name "hbi-bot"
          git config user.email "hbi-bot@users.noreply.github.com"
          git add cours.json
          git diff --cached --quiet || (git commit -m "Cours $(date -u +%d/%m %H:%M) UTC" && git pull --rebase -q && git push)
