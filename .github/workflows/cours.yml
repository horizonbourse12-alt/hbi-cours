name: Cours BRVM
# Une seule exécution longue lit la page des cours toutes les 10 minutes jusqu'à la fermeture du marché (15h00, ±1 min ; 12h00 la veille d'un jour férié ; rien les jours fériés).
# Horaires et jours fériés : scripts/horaire.py (source brvm.org/fr/horaires-de-cotation et /fr/jours-feries).
# Plus fiable que 6 lancements programmés par heure, car GitHub retarde ou saute souvent ces lancements.
on:
  schedule:
    - cron: "30 9 * * 1-5"    # démarrage normal, 9h30 (le premier cours coté est à 9h45 ; GitHub limite une exécution à 6 h)
    - cron: "5 11 * * 1-5"    # filet de sécurité : relance si le démarrage de 9h30 a été sauté
  workflow_dispatch: {}        # démarrage à la main (bouton Run workflow) : elle s'arrête à la fermeture du marché
permissions:
  contents: write
concurrency:
  group: cours
  cancel-in-progress: false
jobs:
  cours:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Lire les cours toutes les 10 minutes jusqu'à la fermeture
        run: |
          git config user.name "hbi-bot"
          git config user.email "hbi-bot@users.noreply.github.com"
          set -- $(python3 scripts/horaire.py)
          [ "$1" = "FERIE" ] && { echo "Marché fermé aujourd'hui (week-end ou jour férié)"; exit 0; }
          FIN=$2
          while true; do
            hm=$(date -u +%H%M)
            [ "$hm" -ge "$FIN" ] && { echo "Fin de séance ($hm UTC)"; break; }
            python3 scripts/fetch_cours.py || echo "Lecture échouée, on réessaie au prochain tour"
            git add cours.json
            git diff --cached --quiet || (git commit -q -m "Cours $(date -u +%d/%m %H:%M) UTC" && git pull --rebase -q && git push -q) || echo "Enregistrement échoué, on réessaie"
            # toutes les 10 min ; toutes les 5 min dans l'heure de clôture pour attraper le dernier cours officiel
            [ "$hm" -ge $((FIN - 70)) ] && sleep 300 || sleep 600
          done
      - name: Visuel du jour (opportunités du marché), juste après la fermeture
        run: |
          [ "$(python3 scripts/horaire.py)" = "FERIE" ] && exit 0
          pip install -q playwright
          python3 -m playwright install --with-deps chromium
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          python3 scripts/visuel.py || { echo "visuel non généré"; exit 0; }
          git add opportunites.png top-cours.png top-volume.png
          git diff --cached --quiet || (git commit -q -m "Visuel du jour $(date -u +%d/%m)" && git pull --rebase -q && git push -q) || echo "enregistrement du visuel échoué"
