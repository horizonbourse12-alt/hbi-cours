name: BOC du soir
on:
  schedule:
    - cron: "0,30 17-20 * * 1-5"   # 17h00 à 20h30 UTC = heure d'Abidjan ; GitHub peut retarder un lancement
    - cron: "30 16 * * 1-5"        # premier passage à 16h30 (le BOC sort parfois vers 16h40)
    - cron: "0 21 * * 1-5"         # dernier passage à 21h00
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: boc
  cancel-in-progress: false
jobs:
  boc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils PDF
        run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Lire le BOC et chercher les rapports annoncés
        run: python3 scripts/fetch_boc.py
      - name: Archiver les BOC des 31 derniers jours (téléchargement dans l'application)
        run: python3 scripts/fetch_boc_archive.py || echo "archive BOC non mise à jour"
      - name: Enregistrer
        run: |
          git config user.name "hbi-bot"
          git config user.email "hbi-bot@users.noreply.github.com"
          git add cours.json boc publications
          git diff --cached --quiet || (git commit -m "BOC $(date -u +%d/%m %H:%M) UTC" && git pull --rebase -q && git push)
